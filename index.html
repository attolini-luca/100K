<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>100K trail</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e2ecfa">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* VOICE: app salute in stile iOS, morbida, ottimista, chiara
   IDEA: la Home di un'app Salute: avatar al centro, tessere colorate con illustrazioni 3D, liste stile Impostazioni
   PICTURE: l'avatar dell'atleta negli anelli + tessere illustrate; la giornata come schede di vetro
   COLOUR and TYPE: cielo azzurro sfumato su bianco, tinte pastello per categoria, accenti saturi; Inter/SF a pesi forti
   LAYOUT: una colonna da telefono, titolo grande, barra a pillola flottante in basso */
:root{color-scheme:light dark;
--bg1:light-dark(#cfe0f6,#0f1a2e);--bg2:light-dark(#eef4fb,#0a0f1a);--bg3:light-dark(#eef2f8,#07090f);
--ink:light-dark(#101318,#f3f5f8);--soft:light-dark(#6b7280,#9aa3b2);--faint:light-dark(#9aa1ad,#6b7383);
--card:light-dark(rgba(255,255,255,.86),rgba(255,255,255,.07));--cardSolid:light-dark(#ffffff,#151b27);
--line:light-dark(rgba(16,19,24,.07),rgba(255,255,255,.08));--field:light-dark(#f3f5f9,rgba(255,255,255,.07));
--shadow:light-dark(0 10px 30px rgba(40,70,120,.10),0 10px 30px rgba(0,0,0,.35));
--t-run:light-dark(#e9f8d4,rgba(140,200,40,.16));--a-run:light-dark(#4f9a00,#a6e34a);
--t-q:light-dark(#fff0d4,rgba(255,170,40,.16));--a-q:light-dark(#d97706,#ffb84d);
--t-str:light-dark(#e4e9f4,rgba(140,160,210,.16));--a-str:light-dark(#44527a,#aab8e0);
--t-circ:light-dark(#ffe3d6,rgba(255,110,60,.16));--a-circ:light-dark(#e2531f,#ff9467);
--t-stair:light-dark(#d6f3ee,rgba(30,190,170,.16));--a-stair:light-dark(#0f9483,#4fd8c4);
--t-mob:light-dark(#e3f6e8,rgba(60,190,110,.16));--a-mob:light-dark(#259451,#6fdc98);
--t-heart:light-dark(#ffe1e5,rgba(255,70,100,.16));--a-heart:light-dark(#e0244a,#ff7a92);
--t-kg:light-dark(#efe4fb,rgba(160,110,240,.16));--a-kg:light-dark(#7c3aed,#c3a1ff);
--t-sleep:light-dark(#e6e6fb,rgba(110,110,240,.16));--a-sleep:light-dark(#4f46e5,#a5a1ff);
--t-long:light-dark(#dcecfb,rgba(70,150,240,.16));--a-long:light-dark(#1d6fd6,#7db7ff);
--blue:light-dark(#2563eb,#7aa7ff)}
:root[data-theme=light]{color-scheme:light}:root[data-theme=dark]{color-scheme:dark}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
body{margin:0;color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow-x:clip;min-height:100vh;
background:radial-gradient(120% 60% at 50% 0%,var(--bg1) 0%,var(--bg2) 55%,var(--bg3) 100%) fixed;padding-bottom:calc(110px + env(safe-area-inset-bottom))}
h1,h2,h3{margin:0;letter-spacing:-.02em}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:0;background:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:2px;border-radius:12px}
.wrap{max-width:640px;margin:0 auto;padding:calc(18px + env(safe-area-inset-top)) 18px 0}
.glass{background:var(--card);backdrop-filter:blur(20px) saturate(1.4);-webkit-backdrop-filter:blur(20px) saturate(1.4);border-radius:26px;box-shadow:var(--shadow);border:1px solid light-dark(rgba(255,255,255,.9),rgba(255,255,255,.06))}
.eyebrow{font-size:13px;font-weight:600;color:var(--soft);margin:0 0 2px}
.vt h1{font-size:32px;font-weight:800;line-height:1.08}
.vh{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin:6px 0 16px}
.pillbtn{height:40px;padding:0 16px;border-radius:99px;background:var(--card);box-shadow:var(--shadow);font-weight:700;font-size:14px;white-space:nowrap}
.sec{font-size:21px;font-weight:800;margin:26px 4px 12px}
/* toast */
#toast{position:fixed;left:50%;top:calc(10px + env(safe-area-inset-top));transform:translate(-50%,-140%);transition:transform .35s cubic-bezier(.2,.9,.3,1.2),visibility 0s .35s;visibility:hidden;z-index:20;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:700;background:var(--cardSolid);box-shadow:var(--shadow);white-space:nowrap;max-width:92vw;overflow:hidden;text-overflow:ellipsis}
#toast.on{transform:translate(-50%,0);visibility:visible;transition:transform .35s cubic-bezier(.2,.9,.3,1.2)}#toast.warn{background:#ff6b3d;color:#fff}
/* tab bar */
nav.tabs{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom));z-index:10;display:flex;gap:2px;padding:6px;border-radius:99px;width:min(94vw,440px)}
nav.tabs a{flex:1;display:grid;justify-items:center;gap:1px;padding:7px 2px 6px;border-radius:99px;color:var(--soft);text-decoration:none;font-size:11px;font-weight:700}
nav.tabs a svg{width:24px;height:24px}
nav.tabs a[aria-current=page]{background:light-dark(#fff,rgba(255,255,255,.12));color:var(--ink);box-shadow:0 4px 14px rgba(40,70,120,.14)}
/* hero */
.hero{display:grid;justify-items:center;text-align:center;padding:4px 0 8px;position:relative}
.rings{position:relative;width:min(78vw,300px);aspect-ratio:1;display:grid;place-items:center}
.rings i{position:absolute;inset:0;border-radius:50%;background:radial-gradient(circle,light-dark(rgba(255,255,255,.55),rgba(255,255,255,.05)) 0%,transparent 70%);border:1px solid light-dark(rgba(255,255,255,.8),rgba(255,255,255,.07))}
.rings i:nth-child(2){inset:12%}.rings i:nth-child(3){inset:24%;background:light-dark(rgba(255,255,255,.65),rgba(255,255,255,.06))}
.rings img.av{position:relative;width:66%;height:66%;object-fit:contain;filter:drop-shadow(0 16px 22px rgba(40,70,120,.25))}
.hero h1{font-size:30px;font-weight:800;margin-top:-6px}
.status{display:inline-flex;gap:6px;align-items:center;padding:8px 16px;border-radius:99px;font-size:13px;font-weight:700}
.status b{color:var(--blue)}
/* tiles */
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.tile{position:relative;text-align:left;padding:14px 14px 16px;border-radius:26px;min-height:136px;overflow:hidden;background:radial-gradient(120% 120% at 92% 60%,var(--t) 0%,transparent 62%),linear-gradient(160deg,var(--cardSolid) 40%,var(--t) 140%);box-shadow:var(--shadow);border:1px solid light-dark(rgba(255,255,255,.95),rgba(255,255,255,.06));width:100%;display:block}
.tile .tl{font-weight:700;font-size:15px;color:var(--a);display:flex;gap:5px;align-items:center;position:relative;z-index:1}
.tile .tl img{width:18px;height:18px}
.tile .rng{position:relative;z-index:1;font-size:12px;font-weight:600;color:var(--soft);margin-top:22px;display:flex;gap:4px;align-items:center;max-width:58%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tile .val{position:relative;z-index:1;font-size:32px;font-weight:800;line-height:1.05;letter-spacing:-.03em;margin-top:2px;display:flex;align-items:baseline;gap:3px;white-space:nowrap}
.tile .val small{font-size:12px;font-weight:700;color:var(--soft);letter-spacing:0;text-transform:uppercase}
.tile .val .okm{color:#34c759;font-size:16px;font-weight:900;margin-left:3px}
.tile img.il{position:absolute;right:-6%;top:54%;transform:translateY(-50%) rotate(-4deg);width:min(56%,124px);aspect-ratio:1;object-fit:contain;filter:drop-shadow(0 12px 14px rgba(30,50,90,.22))}
.tgt{display:inline-block;width:11px;height:11px;border-radius:50%;border:2px solid currentColor;flex:none;box-shadow:inset 0 0 0 2px var(--cardSolid),inset 0 0 0 5px currentColor;opacity:.75}
.herorow{display:flex;align-items:center;gap:10px;margin-top:8px}
.rbtn{width:44px;height:44px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:16px;letter-spacing:1px;color:var(--ink)}
.rbtn img{width:24px;height:24px}
.faces{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px}
.faces button{aspect-ratio:1;border-radius:22px;background:var(--field);display:grid;place-items:center;border:3px solid transparent}
.faces button[aria-pressed=true]{border-color:var(--blue);background:light-dark(#eaf1ff,rgba(122,167,255,.15))}
.faces img{width:78%;height:78%}
.credit{font-size:11.5px;color:var(--faint);text-align:center;margin:22px 10px 0}
.credit a{color:inherit}
/* today list */
.list{padding:6px 0;border-radius:24px}
.lrow{display:grid;grid-template-columns:48px minmax(0,1fr) auto;gap:12px;align-items:center;padding:10px 16px;text-align:left;width:100%;position:relative}
.lrow+.lrow::before{content:"";position:absolute;left:76px;right:16px;top:0;height:1px;background:var(--line)}
.lrow .bub{width:48px;height:48px;border-radius:50%;background:var(--t);display:grid;place-items:center}
.lrow .bub img{width:30px;height:30px}
.lrow b{display:block;font-size:16px;font-weight:700;line-height:1.25}
.lrow small{display:flex;gap:5px;align-items:center;font-size:12.5px;color:var(--soft);flex-wrap:wrap}
.lrow small em{font-style:normal;font-weight:700;color:var(--a)}
.chev{color:var(--faint);font-size:22px;font-weight:400}
.okc{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--faint);color:transparent;font-size:15px;font-weight:900}
.okc.on{background:var(--a);border-color:var(--a);color:#fff}
/* day picker */
.days{display:grid;grid-template-columns:36px repeat(7,minmax(0,1fr)) 36px;gap:4px;align-items:center;padding:6px;border-radius:22px;margin-bottom:16px}
.days .ar{height:52px;border-radius:14px;font-size:22px;color:var(--soft)}
.dp{display:grid;justify-items:center;gap:2px;padding:7px 0 6px;border-radius:16px;font-size:11px;font-weight:700;color:var(--soft)}
.dp b{font-size:17px;color:var(--ink)}
.dp i{width:6px;height:6px;border-radius:50%;background:transparent}
.dp i.p{background:var(--faint)}.dp i.ok{background:#34c759}
.dp[aria-current=date]{background:var(--ink);color:light-dark(#fff,#101318)}
.dp[aria-current=date] b{color:light-dark(#fff,#101318)}
.dp.today:not([aria-current]) b{color:var(--blue)}
/* session cards */
.sc{border-radius:28px;margin:0 0 16px;overflow:hidden;background:linear-gradient(160deg,var(--t) 0%,var(--cardSolid) 46%);box-shadow:var(--shadow);border:1px solid light-dark(rgba(255,255,255,.9),rgba(255,255,255,.06))}
.sc>header{display:grid;grid-template-columns:62px minmax(0,1fr) 48px;gap:12px;padding:16px 16px 6px;align-items:start}
.sc .ic{width:62px;height:62px;border-radius:20px;background:light-dark(rgba(255,255,255,.75),rgba(255,255,255,.08));display:grid;place-items:center;box-shadow:inset 0 1px 0 rgba(255,255,255,.8)}
.sc .ic img{width:46px;height:46px;filter:drop-shadow(0 4px 5px rgba(0,0,0,.12))}
.sc .lbl{font-size:12.5px;font-weight:700;color:var(--a)}
.sc h2{font-size:20px;font-weight:800;line-height:1.18;margin-top:1px}
.sc .tg{font-size:13.5px;color:var(--soft);margin:4px 0 0}
.ck{width:48px;height:48px;border-radius:50%;background:light-dark(#fff,rgba(255,255,255,.08));box-shadow:0 4px 12px rgba(40,70,120,.12);display:grid;place-items:center;color:var(--faint);font-size:22px;font-weight:900;transition:transform .2s}
.ck[aria-pressed=true]{background:#34c759;color:#fff}
.ck:active{transform:scale(.92)}
.steps{list-style:none;margin:8px 16px 4px;padding:0;display:grid;gap:6px}
.steps li{display:grid;grid-template-columns:22px minmax(0,1fr);gap:8px;font-size:14.5px;align-items:start}
.steps li span{width:22px;height:22px;border-radius:50%;background:light-dark(rgba(255,255,255,.85),rgba(255,255,255,.08));display:grid;place-items:center;font-size:11px;font-weight:800;color:var(--a);margin-top:1px}
.fields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px;padding:12px 16px 4px}
.fl{display:grid;gap:4px;font-size:11.5px;font-weight:700;color:var(--soft)}
.in{display:flex;align-items:center;background:var(--field);border-radius:14px;padding:0 10px;min-height:46px;border:1.5px solid transparent}
.in:focus-within{border-color:var(--a);background:light-dark(#fff,rgba(255,255,255,.1))}
.in input{border:0;background:none;outline:none;width:100%;font-size:17px;font-weight:700;padding:10px 0;font-variant-numeric:tabular-nums}
.in input::placeholder{color:var(--faint);font-weight:600}
.in span{font-size:12px;font-weight:700;color:var(--faint);margin-left:4px;white-space:nowrap}
.pace{margin:4px 16px 0;font-size:13px;color:var(--soft)}.pace b{color:var(--a)}
.note{padding:10px 16px 16px}
.note textarea{width:100%;border:0;border-radius:14px;background:var(--field);padding:12px;font-size:15px;min-height:46px;resize:vertical;outline:none}
.ex{margin:10px 12px 0;padding:14px;border-radius:20px;background:light-dark(rgba(255,255,255,.7),rgba(255,255,255,.04))}
.ex h3{font-size:16px;font-weight:800}
.ex .meta{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0 10px}
.tag{font-size:12px;font-weight:700;padding:4px 9px;border-radius:99px;background:var(--field);color:var(--soft);white-space:nowrap}
.tag.a{background:var(--t);color:var(--a)}
.sets{display:grid;grid-template-columns:30px minmax(0,1fr) minmax(0,1fr);gap:8px;align-items:center}
.sets .sn{width:28px;height:28px;border-radius:50%;background:var(--t);color:var(--a);display:grid;place-items:center;font-size:13px;font-weight:800}
.last{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:10px;font-size:12.5px;color:var(--soft)}
.copy{flex:none;height:34px;padding:0 12px;border-radius:99px;background:var(--t);color:var(--a);font-weight:800;font-size:13px}
.chk{display:flex;gap:12px;align-items:center;padding:12px 16px;font-size:15px;position:relative;cursor:pointer}
.chk+.chk::before{content:"";position:absolute;left:52px;right:16px;top:0;height:1px;background:var(--line)}
.chk input{appearance:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--faint);flex:none;display:grid;place-items:center;margin:0}
.chk input:checked{background:var(--a);border-color:var(--a)}
.chk input:checked::after{content:"✓";color:#fff;font-weight:900;font-size:14px}
.rest{padding:28px 22px;text-align:center;border-radius:28px}
.rest img{width:110px;height:110px}
.rest h2{font-size:24px;font-weight:800;margin-top:6px}.rest p{color:var(--soft);margin:6px 0 0}
.exh{display:grid;grid-template-columns:40px minmax(0,1fr) auto;gap:10px;align-items:center}
.exi{width:40px;height:40px;border-radius:12px;background:var(--t);display:grid;place-items:center}
.exi img{width:32px;height:32px;object-fit:contain}
.exctl{display:flex;gap:6px}
.mini{height:32px;padding:0 11px;border-radius:99px;background:var(--field);font-size:12.5px;font-weight:800;color:var(--ink)}
.exadd{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;padding:14px 16px 4px}
.ghost2{font-size:13px;font-weight:700;color:var(--soft);padding:8px 4px}
.libtop{position:sticky;top:-10px;background:var(--cardSolid);padding:4px 0 10px;z-index:1}
.chips{display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:99px;background:var(--field);font-weight:700;font-size:13px;white-space:nowrap}
.chips button[aria-pressed=true]{background:var(--ink);color:light-dark(#fff,#101318)}
.libsec{font-size:13px;font-weight:800;color:var(--soft);margin:16px 4px 6px;display:flex;gap:8px;align-items:center}
.libsec img{width:22px;height:22px}
.edrow{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.edbtns{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px;margin-top:12px}
.btn.sec{background:var(--field);color:var(--ink)}.btn.red{background:#ffe1e5;color:#c81e3a}
/* charts */
.kgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-bottom:4px}
.chart{padding:18px 16px 14px;border-radius:26px;margin-bottom:14px}
.chart h3{font-size:18px;font-weight:800;display:flex;gap:8px;align-items:center}
.chart h3 img{width:28px;height:28px;flex:none}
.chart p{margin:4px 0 10px;font-size:13px;color:var(--soft)}
.fig{position:relative;height:210px}.fig>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.legend{display:flex;flex-wrap:wrap;gap:6px 12px;font-size:12px;font-weight:600;color:var(--soft);margin-top:10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
select.sel{width:100%;height:46px;border-radius:14px;border:0;background:var(--field);padding:0 12px;font-weight:700;font-size:15px;margin-bottom:8px}
.emptyc{height:100%;display:grid;place-items:center;text-align:center;color:var(--soft);font-size:14px;padding:0 20px}
.donut{display:grid;grid-template-columns:150px minmax(0,1fr);gap:16px;align-items:center;padding:18px;border-radius:26px}
.donut svg{width:150px;height:150px}
.donut ul{list-style:none;margin:0;padding:0;display:grid;gap:7px;font-size:13.5px}
.donut li{display:flex;justify-content:space-between;gap:8px}.donut li span{display:flex;gap:7px;align-items:center}
.donut li i{width:10px;height:10px;border-radius:50%;flex:none}
.wk{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:0 0 14px}
.wk button{width:44px;height:44px;border-radius:50%;font-size:22px;color:var(--soft)}
.wk div{text-align:center;font-weight:800}.wk small{display:block;font-weight:600;color:var(--soft);font-size:12px}
.prog{height:8px;border-radius:99px;background:var(--field);overflow:hidden;margin-top:6px}.prog i{display:block;height:100%;border-radius:99px;background:linear-gradient(90deg,#7ad321,#34c759)}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(10,20,40,.35);z-index:30;opacity:0;pointer-events:none;transition:opacity .25s}
.scrim.on{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:31;max-height:88vh;overflow:auto;border-radius:30px 30px 0 0;background:var(--cardSolid);padding:10px 18px calc(24px + env(safe-area-inset-bottom));transform:translateY(105%);visibility:hidden;transition:transform .3s cubic-bezier(.2,.9,.3,1),visibility 0s .3s}
.sheet.on{transform:none;visibility:visible;transition:transform .3s cubic-bezier(.2,.9,.3,1)}
.sheet .grab{width:40px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:22px;font-weight:800;margin-bottom:12px}
.form{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.btn{height:52px;border-radius:16px;background:var(--ink);color:light-dark(#fff,#101318);font-weight:800;font-size:16px;width:100%}
.hist{margin-top:16px}
.del{color:#e0244a;font-weight:700;font-size:13px;padding:8px}
#login{position:fixed;inset:0;z-index:40;display:none;place-items:center;text-align:center;padding:24px;background:radial-gradient(120% 70% at 50% 25%,var(--bg3) 0%,var(--bg2) 45%,var(--bg1) 100%)}
#login.on{display:grid}
#login img{width:150px;height:150px;filter:drop-shadow(0 16px 22px rgba(40,70,120,.25))}
#login h1{font-size:30px;font-weight:800;margin:14px 0 6px}
#login p{color:var(--soft);margin:0 auto 22px;max-width:320px}
#login .btn{max-width:320px;margin:0 auto;display:flex;gap:10px;align-items:center;justify-content:center}
#loginErr{color:#e0244a;font-size:13px;margin-top:12px;min-height:18px;max-width:320px}
@media(min-width:560px){.tiles{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:370px){.fields{grid-template-columns:repeat(2,minmax(0,1fr))}.tile .val{font-size:26px}.donut{grid-template-columns:120px minmax(0,1fr)}.donut svg{width:120px;height:120px}}
@media(prefers-reduced-motion:reduce){#toast,.sheet,.scrim{transition:none}}
</style>
</head>

    else { const n = series.length, w1 = opt.outline ? bw * 0.62 : bw / n; series.forEach((s, j) => { const v = s.v[i] || 0, h = Y(v); if (v) g += `<rect x="${opt.outline ? cx - w1 / 2 : x + j * w1}" y="${base - h}" width="${Math.max(w1 - (n > 1 ? 2 : 0), 2)}" height="${h}" rx="${Math.min(7, w1 / 2)}" fill="${s.c}"/>`; }); }

}
function line(el, pts, opt) {

  if (W < 80 || H < 80) return;

  let lo = Math.min(...pts.map(p => p.y), opt.ref ?? Infinity), hi = Math.max(...pts.map(p => p.y), opt.ref ?? -Infinity); const span = (hi - lo) || Math.max(1, Math.abs(hi) * 0.08); lo -= span * 0.2; hi += span * 0.2;
  const X = ms => pad.l + (W - pad.l - pad.r) * (ms - x0) / (x1 - x0), Y = v => { const t = (v - lo) / (hi - lo); return opt.invert ? pad.t + (H - pad.t - pad.b) * t : H - pad.b - (H - pad.t - pad.b) * t; };

  for (let i = 0; i <= 3; i++) { const v = lo + (hi - lo) * i / 3, y = Y(v); g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${y}" y2="${y}" stroke="var(--line)"/><text x="${pad.l - 6}" y="${y + 4}" text-anchor="end" font-size="11" fill="var(--faint)">${esc(f(v))}</text>`; }
  if (opt.ref != null) g += `<line x1="${pad.l}" x2="${W - pad.r}" y1="${Y(opt.ref)}" y2="${Y(opt.ref)}" stroke="${col}" stroke-width="1.6" stroke-dasharray="5 5" opacity=".7"/>`;
  const P = pts.map(p => [X(toMs(p.x)), Y(p.y)]), base = opt.invert ? pad.t : H - pad.b;
  if (P.length > 1) g += `<path d="M${P[0][0]} ${base}L${P.map(p => p.join(' ')).join('L')}L${P[P.length - 1][0]} ${base}Z" fill="url(#${gr})"/><polyline fill="none" stroke="${col}" stroke-width="3" stroke-linejoin="round" stroke-linecap="round" points="${P.map(p => p.join(',')).join(' ')}"/>`;
  g += P.map((p, i) => `<circle cx="${p[0]}" cy="${p[1]}" r="${i === P.length - 1 ? 6 : 4}" fill="#fff" stroke="${col}" stroke-width="3"><title>${esc(nice(pts[i].x))}: ${esc(f(pts[i].y))}</title></circle>`).join('');

  g += `<text x="${pad.l}" y="${H - 6}" font-size="11" font-weight="600" fill="var(--soft)">${esc(short(isoOf(x0)))}</text><text x="${W - pad.r}" y="${H - 6}" text-anchor="end" font-size="11" font-weight="600" fill="var(--soft)">${esc(short(isoOf(x1)))}</text>`;

}
function drawCharts() {
  figs.clear(); chartRO.disconnect();
  const wk = weeksRange(), ws = wk.map(weekStats), labels = wk.map(w => 'S' + w);
  const D = {
    km: el => bars(el, labels, [{c: '#7cc520', v: ws.map(s => s.kmDone)}], {outline: ws.map(s => s.kmPlan), label: 'Km per settimana'}),
    mix: el => bars(el, labels, Object.keys(CATS).map(k => ({c: CHART_COL[k], v: ws.map(s => s.mins[k])})), {stack: true, min: 60, label: 'Minuti per tipo'}),
    ex: el => { const e = EXD(exSel); line(el, exSeries(exSel), {col: '#5b6b94', label: e.n, fmt: v => fmt(v, 0) + (e.m === 'e1rm' || e.m === 'load' ? ' kg' : e.m === 'sec' ? '"' : ''), empty: 'Ancora nessuna serie di ' + e.n + '.'}); },
    ton: el => bars(el, labels, [['push', '#5b6b94'], ['pull', '#f59e0b'], ['lower', '#7cc520'], ['upper', '#a78bfa']].map(([k, c]) => ({c, v: ws.map(s => s.ton[k])})), {label: 'Tonnellaggio'}),
    pace: el => { const pts = []; for (const d of Object.keys(logs).sort()) for (const [sid, v] of Object.entries(logs[d].s || {})) { const hr = num(v.hr), m = num(v.min), k = num(v.km); if ((sid === 'z2' || sid === 'long') && hr && hr >= 140 && hr <= 152 && m && k) pts.push({x: d, y: m / k}); } line(el, pts, {col: '#e0244a', invert: true, fmt: v => paceFmt(v), label: 'Passo in Z2', empty: 'Compila durata, km e FC media delle uscite facili.'}); },
    long: el => bars(el, labels, [{c: '#3b82f6', v: ws.map(s => s.long || 0)}], {outline: ws.map(s => s.longPlan), label: 'Lungo del sabato'}),
    kg: el => line(el, Object.keys(body).sort().filter(k => num(body[k].kg) != null).map(k => ({x: k, y: num(body[k].kg)})), {col: '#7c3aed', ref: 92, label: 'Peso', empty: 'Aggiungi il peso con "+ Misura".'}),
    rhr: el => line(el, Object.keys(body).sort().filter(k => num(body[k].hr) != null).map(k => ({x: k, y: num(body[k].hr)})), {col: '#e0244a', label: 'FC a riposo', empty: 'Aggiungi la FC a riposo con "+ Misura".'}),
    adh: el => bars(el, labels, [{c: '#34c759', v: ws.map(s => s.n ? s.nDone / s.n * 100 : 0)}], {min: 100, label: 'Aderenza'}),
    circ: el => bars(el, labels, [{c: '#ff6a3d', v: ws.map(s => s.circ || 0)}], {label: 'Circuito', empty: 'Segna il tempo del circuito del giovedì.'})
  };
  for (const el of viewEl.querySelectorAll('[data-chart]')) { const f = () => { try { D[el.dataset.chart](el); } catch (e) { el.textContent = 'Grafico non disponibile'; } }; figs.set(el, f); chartRO.observe(el); f(); }
}

/* ================= render e navigazione ================= */
function render() {
  for (const a of document.querySelectorAll('nav.tabs a')) { if (a.dataset.v === view) a.setAttribute('aria-current', 'page'); else a.removeAttribute('aria-current'); }

  viewEl.innerHTML = ({home: vHome, oggi: vOggi, settimana: vSettimana, progressi: vProgressi, piano: vPiano}[view])();
  if (view === 'progressi') drawCharts();
}
let deferred = false;
const typing = () => { const a = document.activeElement; return a && viewEl.contains(a) && /INPUT|TEXTAREA|SELECT/.test(a.tagName); };
function safeRender() { if (typing()) { deferred = true; return; } render(); }
viewEl.addEventListener('focusout', () => setTimeout(() => { if (deferred && !typing()) { deferred = false; render(); } }, 60));
viewEl.addEventListener('input', e => {
  const t = e.target, sid = t.dataset.s; if (!sid) return;
  const s = editSess(cur, sid);
  if (t.dataset.ex) { s.sets = s.sets || {}; const a = s.sets[t.dataset.ex] = s.sets[t.dataset.ex] || []; const i = +t.dataset.i; a[i] = a[i] || ['', '']; a[i][+t.dataset.j] = t.value.trim(); for (let k = 0; k < a.length; k++) if (!a[k]) a[k] = ['', '']; }
  else if (t.dataset.c) s.chk = Object.assign(s.chk || {}, {[t.dataset.c]: t.checked});
  else if (t.dataset.k) s[t.dataset.k] = t.dataset.k === 'note' ? t.value : t.value.trim();
  queueSave(cur);
});
viewEl.addEventListener('change', e => { if (e.target.id === 'exSel') { exSel = e.target.value; const f = figs.get(viewEl.querySelector('[data-chart=ex]')); if (f) f(); } });
viewEl.addEventListener('click', e => {
  const b = e.target.closest('button'); if (!b) return;
  if (b.dataset.done) { const s = editSess(cur, b.dataset.done); s.done = !s.done; queueSave(cur); render(); if (s.done) toast('Seduta completata 💪'); }
  else if (b.dataset.copy) { const last = lastSets(cur, b.dataset.copy); if (last) { const s = editSess(cur, b.dataset.s); s.sets = s.sets || {}; s.sets[b.dataset.copy] = JSON.parse(JSON.stringify(last.sets)).slice(0, +b.dataset.n || last.sets.length); queueSave(cur); render(); } }
  else if (b.dataset.goday) { cur = b.dataset.goday; go('oggi'); }
  else if (b.dataset.day) { cur = b.dataset.day; render(); }
  else if (b.dataset.step) { cur = addDays(cur, +b.dataset.step); render(); }
  else if (b.id === 'goToday') { cur = localToday(); render(); }
  else if (b.dataset.act === 'sheet') openSheet();
  else if (b.dataset.act === 'faces') openFaces();
  else if (b.dataset.act === 'logout') { if (window.__esci) window.__esci(); }
  else if (b.dataset.swap) openLib(b.dataset.sess, +b.dataset.swap);
  else if (b.dataset.edit) openEdit(b.dataset.sess, +b.dataset.edit);
  else if (b.dataset.addex) openLib(b.dataset.addex, null);
  else if (b.dataset.reset) { const c = Object.assign({}, custom.sess); delete c[b.dataset.reset]; custom.sess = c; saveCustom(); render(); }
  else if (b.dataset.act) go(b.dataset.act);
});
const VIEWS = ['home', 'oggi', 'settimana', 'progressi', 'piano'];
function go(v) { if (location.hash === '#' + v) route(); else location.hash = v; }

window.addEventListener('hashchange', route);
route();
