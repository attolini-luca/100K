<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>100K trail</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="theme-color" content="#e2ecfa">
<style>
  body{margin:0;min-height:100vh;display:grid;place-items:center;text-align:center;font:600 16px/1.4 -apple-system,system-ui,sans-serif;color:#101318;background:radial-gradient(120% 70% at 50% 30%,#fafcff 0%,#e2ecfa 50%,#b8d0f0 100%)}
  img{width:132px;height:132px;border-radius:30px;box-shadow:0 14px 30px rgba(40,70,120,.2)}
  h1{font-size:26px;margin:18px 0 6px}
  a{display:inline-block;margin-top:14px;padding:14px 22px;border-radius:99px;background:#101318;color:#fff;text-decoration:none}
  p{color:#6b7280;margin:0}
</style>
</head>
<body>
<main>
  <img src="icon-512.png" alt="">
  <h1>100K trail</h1>
  <p>Apro la tua scheda…</p>
  <a href="https://claude.ai/artifact/JASFY1xxpDKSCxptCsURKG">Apri la scheda</a>
</main>
<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(() => {});
  // Dall'icona in Home si apre direttamente la scheda; aperta dal browser resta qui per poterla installare
  if (location.search.includes('source=pwa') || matchMedia('(display-mode: standalone)').matches) {
    setTimeout(() => location.replace('https://claude.ai/artifact/JASFY1xxpDKSCxptCsURKG'), 350);
  }
</script>
</body>
</html>
